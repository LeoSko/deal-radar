<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Deal Radar</title>
  <defs>
    <linearGradient id="sweep" x1="32" y1="32" x2="54" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#36d399" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- radar screen -->
  <circle cx="32" cy="32" r="29" fill="#10141a" stroke="#36d399" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#36d399" stroke-opacity="0.22" stroke-width="1.4"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#36d399" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#36d399" stroke-opacity="0.16" stroke-width="1"/>

  <!-- sweep -->
  <path d="M32 32 L32 5 A27 27 0 0 1 54 17 Z" fill="url(#sweep)"/>
  <line x1="32" y1="32" x2="54" y2="17" stroke="#36d399" stroke-width="2.4" stroke-linecap="round"/>

  <!-- food blips the radar is detecting -->
  <!-- pizza slice (hero) -->
  <g transform="translate(30 28) rotate(-12)">
    <path d="M0 11 L-9 -8 L9 -8 Z" fill="#ffcf5c"/>
    <path d="M-9.5 -8 Q0 -13.5 9.5 -8" stroke="#e89a3a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <circle cx="-3" cy="-2.5" r="1.7" fill="#e2554a"/>
    <circle cx="3" cy="0.5" r="1.5" fill="#e2554a"/>
    <circle cx="-1" cy="4" r="1.3" fill="#e2554a"/>
  </g>

  <!-- burger blip -->
  <g transform="translate(45 44)">
    <path d="M-6 -1 A6 4.5 0 0 1 6 -1 Z" fill="#e89a3a"/>
    <rect x="-6" y="-1" width="12" height="2.2" fill="#4fbf52"/>
    <rect x="-6" y="1" width="12" height="2.6" rx="1.2" fill="#8a5532"/>
    <rect x="-6" y="3.4" width="12" height="2.4" rx="1.2" fill="#e89a3a"/>
  </g>

  <!-- drink blip -->
  <circle cx="20" cy="44" r="2.4" fill="#36d399"/>
</svg>
